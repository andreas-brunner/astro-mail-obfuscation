name: Deploy Demo
on:
    push:
        branches:
            - main
        paths:
            - "demo/**"
            - ".github/workflows/deploy-demo.yml"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Build
              uses: withastro/action@v6
              with:
                  path: ./demo
                  node-version: 24
    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
